# Base PostgreSQL locale (alternative à une installation native). Supabase : voir docs/DEPLOYMENT.md
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: immo360
    ports: ["5432:5432"]
    volumes: [immo360-db:/var/lib/postgresql/data]
volumes:
  immo360-db: {}
